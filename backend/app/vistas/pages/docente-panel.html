<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi panel - Sistema de Incidencias UCV</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/pages.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="contenedor-sidebar"></aside>
    <div class="app-shell-principal">
      <header id="contenedor-topbar"></header>
      <main class="contenedor-pagina">
        <section id="contenedor-atajo-apertura" aria-label="Solicitar apertura de laboratorio"></section>
        <section id="contenedor-formulario-incidencia" aria-label="Registrar incidencia"></section>
        <section aria-label="Mis incidencias">
          <div id="contenedor-filtros-historial"></div>
          <div id="contenedor-tabla-incidencias"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="contenedor-chatbot"></div>
  <div id="contenedor-modal"></div>

  <script type="module">
    import { DocentePanelController } from "../js/controllers/DocentePanelController.js";
    new DocentePanelController(document.body);
  </script>
</body>
</html>

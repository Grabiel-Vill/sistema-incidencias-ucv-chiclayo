<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Sistema de Incidencias UCV</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/layout.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/pages.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="contenedor-sidebar"></aside>
    <div class="app-shell-principal">
      <header id="contenedor-topbar"></header>
      <main class="contenedor-pagina">
        <section id="contenedor-stats" aria-label="Indicadores generales"></section>
        <div class="contenedor-graficos">
          <section id="contenedor-grafico-kpis" aria-label="KPIs por laboratorio"></section>
          <section id="contenedor-grafico-fallas" aria-label="Frecuencia de fallas"></section>
        </div>
        <section id="contenedor-exportar" aria-label="Exportar reporte"></section>
      </main>
    </div>
  </div>

  <script type="module">
    import { AdminDashboardController } from "../js/controllers/AdminDashboardController.js";
    new AdminDashboardController(document.body);
  </script>
</body>
</html>
